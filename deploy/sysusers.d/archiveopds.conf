# System user for archiveopds (see deploy/systemd/archiveopds.service).
# Installation: /usr/lib/sysusers.d/archiveopds.conf (package) or /etc/sysusers.d/archiveopds.conf
# Application: systemd-sysusers(8) - often when installing a package or `systemd-sysusers --create`
u archiveopds - "archiveopds OPDS server" /var/lib/archiveopds /usr/sbin/nologin
