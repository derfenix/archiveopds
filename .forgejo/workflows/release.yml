name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: 
      - debian-node
      - fast
    steps:
      - uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: https://github.com/actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: https://github.com/goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          # Runner подставляет GITHUB_TOKEN глобально; GoReleaser допускает только один из SCM-токенов.
          GITHUB_TOKEN: ""
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
