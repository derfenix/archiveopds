name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: 
      - debian-node
      - fast
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.2.0
          args: --timeout=3m

      - name: go test
        run: go test ./...

      - name: go test (race)
        run: go test -race -count=1 ./...

      - name: go build
        run: go build -trimpath -ldflags="-s -w" -o bin/archiveopds ./cmd/archiveopds
